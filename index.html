<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>جارٍ التحميل</title>
<style>body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:#0f6b63;color:#fff;text-align:center}.b{padding:24px}.s{width:42px;height:42px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head>
<body><div class="b"><div class="s"></div><div id="m">جارٍ تحميل الكتاب… قد يستغرق لحظات</div></div>
<script>(async()=>{const m=document.getElementById('m');try{const h=location.hash.slice(1);if(!h){m.textContent='الرابط غير صالح';return}
const p=h.replace(/-/g,'+').replace(/_/g,'/');const kb=Uint8Array.from(atob(p+'='.repeat((4-p.length%4)%4)),c=>c.charCodeAt(0));
const vv=(await(await fetch('v.txt?'+Date.now(),{cache:'no-store'})).text()).trim();const r=await fetch('p.bin?v=11020145'+vv,{cache:'force-cache'});const buf=new Uint8Array(await r.arrayBuffer());
const key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}catch(e){m.textContent='تعذّر فتح الصفحة: الرابط غير صحيح أو ناقص'}})()</script></body></html>
